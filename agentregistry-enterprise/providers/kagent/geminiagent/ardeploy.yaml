apiVersion: ar.dev/v1alpha1
kind: Deployment
metadata:
  name: k8shelper
spec:
  targetRef:
    kind: Agent
    name: k8shelper
    tag: "1.0.0"
  runtimeRef:
    kind: Runtime
    name: kagent
  runtimeConfig:
    # Overrides the catalog Agent's image; keep it in sync with K8SHELPER_IMAGE.
    image: ${K8SHELPER_IMAGE}
    deployedBy: michael.levan@solo.io
  env:
    MODEL_PROVIDER: gemini
    MODEL_NAME: gemini-2.5-flash
    # Filled in by envsubst at apply time; never commit the real key.
    GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
