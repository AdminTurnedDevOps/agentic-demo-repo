[project]
name = "runtime-agent"
version = "0.1.0"
description = "Strands chat agent for Amazon Bedrock AgentCore Runtime, deployed by AgentRegistry"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "strands-agents>=1.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "httpx>=0.28.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
