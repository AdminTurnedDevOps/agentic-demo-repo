# Applied in Demo 4, not at make deploy / make demo-reset.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBudget
metadata:
  name: dealeriq-daily-token-budget
  namespace: dealeriq
  labels:
    app.kubernetes.io/part-of: dealeriq
spec:
  budgets:
    - name: dealeriq-claude-daily
      limit:
        amount: 4000
        unit: Tokens
      onBudgetExceeded: Block
      subject:
        model: claude-sonnet-4-6
        provider: anthropic
      window:
        unit: Day
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: dealeriq-budget-enforcement
  namespace: dealeriq
  labels:
    app.kubernetes.io/part-of: dealeriq
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: dealeriq-llm-route
  traffic:
    entBudgetEnforcement:
      discovery:
        namespaces:
          from: Same
