      port: 8080
      targetPort: http
---
# Priority group 0 is the failing mock. Group 1 is the healthy mock.
# After consecutive 5xx, health eviction takes group 0 out and traffic
# fails over to group 1 (HTTP 200).
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: dealeriq-mock-llm
  namespace: dealeriq
  labels:
    app.kubernetes.io/name: dealeriq-mock-llm
    app.kubernetes.io/part-of: dealeriq
spec:
  ai:
    groups:
      - providers:
          - name: failing
            openai:
              model: mock-llm
            host: dealeriq-mock-llm.dealeriq.svc.cluster.local
            port: 8080
      - providers:
          - name: healthy
            openai:
              model: mock-llm
            host: dealeriq-mock-llm-ok.dealeriq.svc.cluster.local
            port: 8080

