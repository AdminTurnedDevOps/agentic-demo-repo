---
apiVersion: v1
kind: Service
metadata:
  name: dealeriq-mock-llm-ok
  namespace: dealeriq
  labels:
    app.kubernetes.io/name: dealeriq-mock-llm-ok
    app.kubernetes.io/part-of: dealeriq
spec:
  selector:
    app.kubernetes.io/name: dealeriq-mock-llm-ok
  ports:
