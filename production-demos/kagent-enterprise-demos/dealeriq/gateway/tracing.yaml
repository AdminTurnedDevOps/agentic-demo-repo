apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: dealeriq-llm-tracing
  namespace: dealeriq
  labels:
    app.kubernetes.io/part-of: dealeriq
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: dealeriq-llm
  frontend:
    tracing:
      backendRef:
        group: ""
        kind: Service
        name: solo-enterprise-telemetry-collector
        namespace: agentgateway-system
        port: 4317
      protocol: GRPC
      randomSampling: "true"
