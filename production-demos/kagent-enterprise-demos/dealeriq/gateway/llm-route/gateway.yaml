apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dealeriq-llm
  namespace: dealeriq
  labels:
    app.kubernetes.io/part-of: dealeriq
    app: dealeriq-llm
spec:
  gatewayClassName: enterprise-agentgateway
  listeners:
    - name: http
      port: 8082
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: dealeriq-claude
  namespace: dealeriq
  labels:
    app.kubernetes.io/part-of: dealeriq
spec:
  ai:
    provider:
      anthropic:
        model: claude-sonnet-4-6
  policies:
    auth:
      secretRef:
        name: anthropic-secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dealeriq-llm-route
  namespace: dealeriq
  labels:
    app.kubernetes.io/part-of: dealeriq
    app: dealeriq-llm
spec:
  parentRefs:
    - name: dealeriq-llm
      namespace: dealeriq
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /anthropic
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/chat/completions
      backendRefs:
        - group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
          name: dealeriq-claude
          namespace: dealeriq
    - matches:
        - path:
            type: PathPrefix
            value: /mock-llm
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/chat/completions
      backendRefs:
        - group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
          name: dealeriq-mock-llm
          namespace: dealeriq
