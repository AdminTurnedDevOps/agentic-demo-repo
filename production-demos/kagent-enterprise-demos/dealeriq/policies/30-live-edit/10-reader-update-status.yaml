# Demo 1 live change: grant update_lead_status without restarting agents.
# Applied during the talk track; removed by `make demo-reset`.
apiVersion: policy.kagent-enterprise.solo.io/v1alpha1
kind: AccessPolicy
metadata:
  name: dealeriq-reader-update-lead-status
  namespace: dealeriq
  labels:
    app.kubernetes.io/part-of: dealeriq
    dealeriq.demo/live-edit: "true"
spec:
  action: ALLOW
  from:
    subjects:
      - kind: ServiceAccount
        name: dealer-assistant
        namespace: dealeriq
      - kind: ServiceAccount
        name: dealer-assistant-byo
        namespace: dealeriq
  targetRef:
    kind: MCPServer
    name: dealer-leads-mcp
    tools:
      - update_lead_status
