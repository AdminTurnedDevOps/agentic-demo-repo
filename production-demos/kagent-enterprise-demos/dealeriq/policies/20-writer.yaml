# Privileged tools for both DealerIQ agents except bulk PII export.
# Not applied at deploy/demo-reset. Applied in Demo 1 after the reader
# "cannot update status" prompt, so that step stays denied.
apiVersion: policy.kagent-enterprise.solo.io/v1alpha1
kind: AccessPolicy
metadata:
  name: dealeriq-writer-tools
  namespace: dealeriq
  labels:
    app.kubernetes.io/part-of: dealeriq
    dealeriq.demo/persona: writer
spec:
  action: ALLOW
  from:
    subjects:
      - kind: ServiceAccount
        name: dealer-assistant
        namespace: dealeriq
      - kind: ServiceAccount
        name: dealer-assistant-byo
        namespace: dealeriq
  targetRef:
    kind: MCPServer
    name: dealer-leads-mcp
    tools:
      - get_lead_details
      - score_lead
      - search_inventory
      - get_vehicle_history
      - draft_followup
      - send_customer_offer
      - update_lead_status
