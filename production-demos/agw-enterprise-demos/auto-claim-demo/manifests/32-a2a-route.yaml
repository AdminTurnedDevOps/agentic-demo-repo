# The front door: members (via the claims portal) reach claims-agent over A2A
# through claims-gateway, so the gateway sees agent-to-agent traffic and can
# require identity before the agent ever runs.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: claims-agent-a2a
  namespace: auto-claims
  labels:
    app.kubernetes.io/part-of: auto-claim-demo
spec:
  a2a:
    host: claims-agent.auto-claims.svc.cluster.local
    port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: claims-a2a
  namespace: auto-claims
  labels:
    app.kubernetes.io/part-of: auto-claim-demo
spec:
  parentRefs:
    - name: claims-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /a2a/claims-agent
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      timeouts:
        request: "600s"
      backendRefs:
        - group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
          name: claims-agent-a2a
