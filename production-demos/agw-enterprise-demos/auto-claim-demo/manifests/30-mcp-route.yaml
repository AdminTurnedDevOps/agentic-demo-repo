apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: claims-mcp
  namespace: auto-claims
  labels:
    app.kubernetes.io/part-of: auto-claim-demo
spec:
  entMcp:
    sessionRouting: Stateless
    targets:
      - name: claims
        static:
          host: claims-mcp.auto-claims.svc.cluster.local
          port: 3000
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: claims-mcp
  namespace: auto-claims
  labels:
    app.kubernetes.io/part-of: auto-claim-demo
spec:
  parentRefs:
    - name: claims-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      timeouts:
        request: "0s"
      backendRefs:
        - group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
          name: claims-mcp
