<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Substrate v1.0.0-rc.1 · Product bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a two-channel test bench. Every change runs the same input through
   channel A (the old behavior) and channel B (rc.1), with a product lens underneath. */
:root {
  --bg: #f3f1ea; --panel: #fdfcf8; --well: #ebe8df; --ink: #17191d; --ink-2: #565b64; --rule: #d6d2c6;
  --a: #6b7280; --a-soft: #e6e6e3; --b: #0a6f6a; --b-soft: #d5ebe7; --b-ink: #ffffff;
  --ok: #1b7a4b; --warn: #a96a0b; --bad: #bf3426; --idle: #8a8f98; --warn-soft: #f6e6c6; --bad-soft: #f6d9d3; --ok-soft: #d5ecdd;
  --t1: #2f5fb3; --t2: #a3489c; --t3: #b46a12; --t4: #0a7f78;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111317; --panel: #191c21; --well: #22262c; --ink: #e8e6df; --ink-2: #a0a5ae; --rule: #30353c;
  --a: #9097a3; --a-soft: #2a2e34; --b: #38c4b4; --b-soft: #12332f; --b-ink: #06211e;
  --ok: #45b97d; --warn: #e0a23c; --bad: #ec6a5b; --idle: #7d838d; --warn-soft: #3b2e14; --bad-soft: #3e1f1b; --ok-soft: #15331f;
  --t1: #6f9ae6; --t2: #d27fca; --t3: #e0a050; --t4: #38c4b4; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111317; --panel: #191c21; --well: #22262c; --ink: #e8e6df; --ink-2: #a0a5ae; --rule: #30353c;
  --a: #9097a3; --a-soft: #2a2e34; --b: #38c4b4; --b-soft: #12332f; --b-ink: #06211e;
  --ok: #45b97d; --warn: #e0a23c; --bad: #ec6a5b; --idle: #7d838d; --warn-soft: #3b2e14; --bad-soft: #3e1f1b; --ok-soft: #15331f;
  --t1: #6f9ae6; --t2: #d27fca; --t3: #e0a050; --t4: #38c4b4; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15.5px/1.5 var(--f-body); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.08; margin: 0; text-wrap: balance; }
p { margin: 0; }
code, .mono { font-family: var(--f-data); font-size: .87em; }
p code, li code, td code, .rich code { background: var(--well); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--b); outline-offset: 2px; }
.lab { font: 700 .71rem/1.2 var(--f-display); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }

/* chrome */
.top { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: space-between; padding: 10px clamp(14px, 2.4vw, 26px); background: var(--bg); border-bottom: 2px solid var(--ink); }
.brand { display: flex; gap: 11px; align-items: center; background: none; border: 0; color: inherit; cursor: pointer; padding: 0; text-align: left; }
.brand .mark { display: grid; grid-template-columns: 1fr 1fr; width: 34px; height: 34px; border: 2px solid var(--ink); border-radius: 3px; overflow: hidden; font: 800 .86rem/30px var(--f-display); text-align: center; flex: none; }
.brand .mark i { font-style: normal; background: var(--a); color: #fff; } .brand .mark i + i { background: var(--b); color: var(--b-ink); }
.brand b { display: block; font: 800 1.08rem/1.1 var(--f-display); }
.brand small { display: block; font: 400 .72rem/1.3 var(--f-data); color: var(--ink-2); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: 700 .86rem/1 var(--f-display); border: 2px solid var(--ink); background: transparent; color: var(--ink); padding: 8px 12px; border-radius: 3px; cursor: pointer; }
.btn:hover { background: var(--well); }
.btn.go { background: var(--ink); color: var(--bg); }
.btn.go:hover { opacity: .86; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 3px; overflow: hidden; max-width: 100%; flex-wrap: wrap; }
.seg button { font: 600 .82rem/1.1 var(--f-body); background: transparent; color: var(--ink); border: 0; padding: 7px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); align-items: start; }
.rail { position: sticky; top: 60px; max-height: calc(100vh - 60px); overflow-y: auto; padding: 16px 12px 24px clamp(14px, 2.4vw, 26px); display: grid; gap: 15px; }
.rail .home { text-align: left; }
.rail section { display: grid; gap: 2px; }
.rail .lab { padding: 0 8px 3px; }
.rail button.item { display: grid; grid-template-columns: 1.7em 1fr auto; gap: 3px; align-items: baseline; width: 100%; text-align: left; padding: 5px 8px; background: none; color: var(--ink); border: 0; border-left: 3px solid transparent; border-radius: 0 3px 3px 0; font: 400 .86rem/1.25 var(--f-body); cursor: pointer; }
.rail button.item .n { font: 600 .72rem/1 var(--f-data); color: var(--ink-2); }
.rail button.item:hover { background: var(--well); }
.rail button.item[aria-current="page"] { border-left-color: var(--b); background: var(--panel); font-weight: 600; }
.rail button.item .seen { width: 7px; height: 7px; border-radius: 50%; background: transparent; align-self: center; }
.rail button.item.done .seen { background: var(--b); }
.progress { font: 400 .74rem/1.3 var(--f-data); color: var(--ink-2); padding: 0 8px; }
main { padding: 20px clamp(14px, 2.6vw, 34px) 60px; min-width: 0; display: grid; gap: 18px; max-width: 1180px; }
@media (max-width: 960px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: static; max-height: none; display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
  .rail section { display: contents; } .rail .lab, .rail .progress { display: none; }
  .rail button.item { width: auto; white-space: nowrap; grid-template-columns: auto auto auto; gap: 6px; border: 1px solid var(--rule); border-radius: 3px; }
  .rail button.item[aria-current="page"] { border-color: var(--b); }
}

/* feature head */
.head { display: grid; gap: 7px; }
.head .kick { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.head h2 { font-size: clamp(1.7rem, 3.2vw, 2.45rem); font-weight: 800; letter-spacing: -.01em; max-width: 26ch; }
.head .q { font-size: 1.1rem; max-width: 66ch; }
.head .q b { font-weight: 600; }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.tag { display: inline-block; font: 700 .68rem/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; padding: 3px 6px; border-radius: 2px; border: 1px solid var(--rule); color: var(--ink-2); }
.tag.break { color: var(--bad); border-color: var(--bad); }
.tag.opt { color: var(--warn); border-color: var(--warn); }

/* bench */
.bench { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: clamp(12px, 1.8vw, 18px); display: grid; gap: 13px; min-width: 0; }
.ctl { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; padding-bottom: 13px; border-bottom: 1px dashed var(--rule); }
.fld { display: grid; gap: 4px; min-width: 0; }
.chk { display: inline-flex; gap: 7px; align-items: flex-start; font-size: .88rem; line-height: 1.25; cursor: pointer; max-width: 28ch; }
.chk input { width: 16px; height: 16px; margin: 1px 0 0; accent-color: var(--b); flex: none; }
input[type="range"] { accent-color: var(--b); width: 170px; }
input[type="text"], select { font: 400 .9rem/1.2 var(--f-data); background: var(--bg); color: var(--ink); border: 2px solid var(--ink); border-radius: 3px; padding: 6px 8px; min-width: 0; }
.fld .val { font: 600 .82rem/1 var(--f-data); color: var(--ink); text-transform: none; letter-spacing: 0; }
.panes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 780px) { .panes { grid-template-columns: 1fr; } }
.pane { border: 2px solid var(--a); border-radius: 4px; display: grid; align-content: start; min-width: 0; background: var(--panel); }
.pane.b { border-color: var(--b); }
.pane > header { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--a-soft); font: 700 .84rem/1.2 var(--f-display); }
.pane.b > header { background: var(--b-soft); }
.pane > header .ch { font: 800 .72rem/1 var(--f-display); padding: 3px 6px; border-radius: 2px; background: var(--a); color: #fff; flex: none; }
.pane.b > header .ch { background: var(--b); color: var(--b-ink); }
.pane > header .sub { margin-left: auto; font: 400 .72rem/1.15 var(--f-data); color: var(--ink-2); text-align: right; }
.pane .inner { padding: 10px; display: grid; gap: 9px; min-width: 0; }
.outcome { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 10px; min-height: 30px; font-size: .9rem; }
.badge { display: inline-block; font: 700 .76rem/1 var(--f-display); letter-spacing: .02em; padding: 5px 7px 4px; border-radius: 3px; background: var(--well); color: var(--ink-2); white-space: nowrap; }
.badge.ok { background: var(--ok); color: #fff; } .badge.bad { background: var(--bad); color: #fff; } .badge.warn { background: var(--warn); color: #fff; }
:root[data-theme="dark"] .badge.ok, :root[data-theme="dark"] .badge.bad, :root[data-theme="dark"] .badge.warn { color: #101215; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge.ok, :root:not([data-theme="light"]) .badge.bad, :root:not([data-theme="light"]) .badge.warn { color: #101215; } }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; }
.stat { background: var(--well); border-radius: 3px; padding: 6px 8px; display: grid; gap: 1px; min-width: 0; }
.stat b { font: 600 1.14rem/1.15 var(--f-data); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat span { font-size: .71rem; line-height: 1.2; color: var(--ink-2); }
.term { background: #15171b; color: #d9dbd6; font: 400 .74rem/1.45 var(--f-data); padding: 9px 10px; border-radius: 3px; overflow-x: auto; white-space: pre; min-height: 54px; }
.term .p { color: #6fd6c8; } .term .e { color: #f58a7a; } .term .d { color: #8d939c; } .term .g { color: #8fd7a4; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: .78rem; line-height: 1.3; max-height: 158px; overflow-y: auto; min-height: 38px; }
.log li { display: grid; grid-template-columns: 3.2em 1fr; gap: 6px; }
.log li i { font: 400 .72rem/1.35 var(--f-data); font-style: normal; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.log li.bad span { color: var(--bad); font-weight: 600; } .log li.ok span { color: var(--ok); font-weight: 600; } .log li.warn span { color: var(--warn); font-weight: 600; }
.note { font-size: .85rem; color: var(--ink-2); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .8rem; }
th { text-align: left; font: 700 .68rem/1.15 var(--f-display); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); padding: 4px 8px 4px 0; border-bottom: 1px solid var(--ink); }
td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.m { font-family: var(--f-data); font-size: .75rem; }
tr.scan { background: var(--well); }
.y { color: var(--ok); font-weight: 600; } .n { color: var(--bad); font-weight: 600; } .w { color: var(--warn); font-weight: 600; } .dim { color: var(--ink-2); }

/* flow */
.flow { position: relative; display: flex; justify-content: space-between; align-items: stretch; gap: 14px; padding: 4px 0; }
.flow::before { content: ""; position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: var(--rule); }
.fnode { position: relative; flex: 1 1 0; min-width: 0; background: var(--well); border: 2px solid var(--rule); border-radius: 3px; padding: 5px 5px; text-align: center; font: 600 .72rem/1.15 var(--f-body); display: grid; align-content: center; gap: 2px; transition: border-color .15s, background .15s; overflow-wrap: anywhere; }
.fnode small { font: 400 .63rem/1.15 var(--f-data); color: var(--ink-2); }
.fnode.ok { border-color: var(--ok); background: var(--ok-soft); } .fnode.bad { border-color: var(--bad); background: var(--bad-soft); } .fnode.wait { border-color: var(--warn); background: var(--warn-soft); }
.pkt { position: absolute; top: 50%; width: 13px; height: 13px; margin-top: -6.5px; margin-left: -6.5px; border-radius: 50%; background: var(--b); box-shadow: 0 0 0 3px var(--panel); z-index: 2; left: 0; transition-property: left; transition-timing-function: linear; }
.pkt.badp { background: var(--bad); }

/* bars */
.bar { position: relative; height: 15px; background: var(--well); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--b); }
.bar.thick { height: 24px; }
.bar .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); z-index: 1; }
.stack { display: flex; height: 26px; border-radius: 2px; overflow: hidden; background: var(--well); }
.stack > i { display: block; height: 100%; min-width: 0; border-right: 1px solid var(--panel); }
.actor { display: grid; grid-template-columns: 3.2em 1fr 7.5em; gap: 7px; align-items: center; font-size: .76rem; }
.actor .nm { font: 600 .74rem/1 var(--f-data); }
.actor .st { font: 600 .68rem/1.1 var(--f-data); text-align: right; }
.st.RUNNING { color: var(--ok); } .st.CRASHED { color: var(--bad); } .st.THROTTLED { color: var(--warn); } .st.DONE, .st.SUSPENDED { color: var(--ink-2); } .st.WRITING { color: var(--b); }
.key { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: .72rem; color: var(--ink-2); }
.key span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 5px; background: var(--k); }

/* gantt */
.lane { display: grid; grid-template-columns: 7.6em 1fr; gap: 7px; align-items: center; font-size: .74rem; }
.lane .bar > i { transition: none; }
.lane .bar > i.bad { background: var(--bad); } .lane .bar > i.dimf { background: var(--idle); } .lane .bar > i.ok { background: var(--ok); }

/* cpu */
.cores { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
.core { display: grid; gap: 3px; border: 2px solid var(--rule); border-radius: 3px; padding: 4px; }
.core.x { border-color: var(--bad); background: var(--bad-soft); }
.thread { height: 27px; border-radius: 2px; background: var(--well); display: grid; place-items: center; font: 600 .68rem/1 var(--f-data); color: #fff; }
.thread.idle { color: var(--ink-2); }
.thread.forced { background: repeating-linear-gradient(-45deg, transparent 0 4px, var(--rule) 4px 6px); color: var(--ink-2); }

/* cache */
.cache { display: grid; gap: 6px; }
.cache-row { display: grid; grid-template-columns: 6.6em 1fr; gap: 6px; align-items: center; font-size: .72rem; }
.cells { display: flex; flex-wrap: wrap; gap: 2px; }
.cells i { width: 11px; height: 11px; border-radius: 1px; background: var(--b); transition: background .18s; }
.cells i.torn { background: var(--bad); } .cells i.empty { background: var(--well); outline: 1px solid var(--rule); outline-offset: -1px; }

/* timeline */
.tl { position: relative; height: 62px; margin: 3px 3px 0; }
.tl .band { position: absolute; top: 18px; height: 16px; font: 600 .63rem/16px var(--f-data); padding-left: 4px; overflow: hidden; white-space: nowrap; color: #fff; }
.tl .cursor { position: absolute; top: 0; bottom: 8px; width: 2px; background: var(--bad); z-index: 2; }
.tl .cursor::after { content: "node deleted"; position: absolute; top: -2px; left: 4px; white-space: nowrap; font: 700 .64rem/1.2 var(--f-display); color: var(--bad); }
.tl .cursor.flip::after { left: auto; right: 4px; }
.tl .tick { position: absolute; top: 38px; font: 400 .62rem/1 var(--f-data); color: var(--ink-2); transform: translateX(-50%); }
.steps { display: grid; gap: 4px; font-size: .82rem; list-style: none; margin: 0; padding: 0; min-height: 30px; }
.steps li { display: grid; grid-template-columns: 1.1em 1fr; gap: 5px; animation: rise .22s ease-out; line-height: 1.3; }
.steps li::before { content: "›"; font-weight: 700; color: var(--ink-2); }
.steps li.bad { color: var(--bad); font-weight: 600; } .steps li.ok { color: var(--ok); font-weight: 600; } .steps li.warn { color: var(--warn); font-weight: 600; }
@keyframes rise { from { opacity: .2; transform: translateY(3px); } to { opacity: 1; transform: none; } }

/* matrix */
.matrix { display: grid; grid-template-columns: 8.5em repeat(3, minmax(0, 1fr)); gap: 3px; font-size: .72rem; }
.matrix .hd { font: 700 .66rem/1.15 var(--f-display); color: var(--ink-2); padding: 3px; align-self: end; }
.matrix button { font: 600 .68rem/1.15 var(--f-data); padding: 6px 3px; border: 2px solid transparent; border-radius: 3px; cursor: pointer; color: #fff; overflow-wrap: anywhere; min-width: 0; }
.matrix button.ok { background: var(--ok); } .matrix button.bad { background: var(--bad); } .matrix button.warn { background: var(--warn); }
.matrix button.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--panel) inset; }
:root[data-theme="dark"] .matrix button { color: #101215; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .matrix button { color: #101215; } }

/* lens */
.lens { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 3px solid var(--ink); }
@media (max-width: 860px) { .lens { grid-template-columns: 1fr; } }
.lens > div { padding: 11px 16px 4px 0; display: grid; gap: 5px; align-content: start; }
.lens > div + div { padding-left: 16px; border-left: 1px solid var(--rule); }
@media (max-width: 860px) { .lens > div + div { padding-left: 0; border-left: 0; border-top: 1px solid var(--rule); } }
.lens p { font-size: .93rem; }
.fine { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px 26px; }
@media (max-width: 860px) { .fine { grid-template-columns: 1fr; } }
.fine ul { margin: 5px 0 0; padding-left: 18px; display: grid; gap: 5px; font-size: .88rem; }
.src { font-size: .82rem; color: var(--ink-2); display: grid; gap: 5px; align-content: start; }
.src .prs { display: flex; flex-wrap: wrap; gap: 6px; }
.src a { font-family: var(--f-data); font-size: .78rem; }
.say { font-size: 1.02rem; font-style: italic; }

/* home + brief */
.home-hero { display: grid; gap: 10px; max-width: 74ch; }
.home-hero h2 { font-size: clamp(1.9rem, 4vw, 3rem); font-weight: 800; letter-spacing: -.015em; }
.home-track { display: grid; gap: 7px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 8px; }
.card { display: grid; gap: 5px; text-align: left; align-content: start; background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--b); border-radius: 3px; padding: 10px 12px; color: inherit; cursor: pointer; font: inherit; }
.card:hover { background: var(--well); }
.card b { font: 700 .98rem/1.15 var(--f-display); }
.card span { font-size: .84rem; color: var(--ink-2); line-height: 1.32; }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 3px solid var(--ink); }
.how > div { padding: 10px 16px 4px 0; font-size: .91rem; } .how > div + div { padding-left: 16px; border-left: 1px solid var(--rule); }
.how h3 { font-size: 1rem; margin-bottom: 4px; }
@media (max-width: 760px) { .how { grid-template-columns: 1fr; } .how > div + div { padding-left: 0; border-left: 0; border-top: 1px solid var(--rule); } }
.brief td { font-size: .85rem; line-height: 1.32; padding: 8px 12px 8px 0; }
.brief td:first-child { font-weight: 600; min-width: 12em; }
.brief td button { all: unset; cursor: pointer; text-decoration: underline; }
.brief table { min-width: 760px; }
.foot { font-size: .78rem; color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 11px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<header class="top">
  <button class="brand" id="brand" title="Back to start">
    <span class="mark" aria-hidden="true"><i>A</i><i>B</i></span>
    <span><b>Substrate rc.1 product bench</b><small>v1.0.0-rc.1 · f86fde9d · simulated, no cluster</small></span>
  </button>
  <div class="tools">
    <span class="lab">Speed</span><div class="seg" id="speed" role="group" aria-label="Simulation speed"></div>

/* ---------- scene: egress during boot ---------- */
function sceneBoot(root, ctx) {
  const st = { path: "actor", host: "allowed" };
  const run = ctx.runner();
  const LANES = [["egress", "Egress"], ["fetch", "Startup fetch"], ["probe", "Wakeup probe"], ["ingress", "Ingress"]];
  const mk = (kind, title) => {
    const p = pane(kind, title, kind === "a" ? A_TITLE : B_TITLE), bars = {};
    LANES.forEach(([k, l]) => { const i = h("i"); bars[k] = i; p.inner.append(h("div.lane", h("span", l), h("div.bar", i))); });
    const clock = h("span.mono.dim"), out = h("div.outcome"), log = logBox();
    p.inner.append(log, out);
    return { ...p, bars, clock, out, log };
  };
  const A = mk("a", "Egress waits for the probe"), B = mk("b", "Egress starts before the container");
  root.append(h("div.ctl",
    seg("Boot path", [["actor", "Actor with its EgressPolicy"], ["golden", "Golden actor, no policy"], ["gep", "Golden with goldenEgressPolicy (preview)"]], st.path, v => { st.path = v; reset(); }),
    seg("Startup code fetches from", [["allowed", "Host in policy"], ["blocked", "Host not in policy"]], st.host, v => { st.host = v; reset(); }),
    h("button.btn.go", { onclick: go }, "Boot it")), h("div.panes", A.el, B.el));
  const TIMEOUT = 30;
  function plan(isB) {
    const hasPolicy = st.path !== "golden";
    if (!isB) return { egressAt: null, fetchEnd: null, why: "`atunnel` closes the connection inside the sandbox", ok: false };
    if (!hasPolicy) return { egressAt: 0, why: "No policy: no tunnel, and DNS returns NXDOMAIN", ok: false };
    if (st.host === "blocked") return { egressAt: 0, why: "Host isn't allowed: DNS returns NXDOMAIN", ok: false };
    return { egressAt: 0, fetchEnd: 12, ok: true };
  }
  function reset() { run.cancel(); [A, B].forEach(p => { Object.values(p.bars).forEach(b => { b.style.width = "0"; b.className = ""; }); p.log.clear(); setOut(p.out); }); }
  async function go() {
    reset();
    const r = run.start(), goldenPath = st.path !== "actor";
    const pa = plan(false), pb = plan(true);
    const scale = TIMEOUT + 2;
    const pct = t => Math.min(100, t / scale * 100) + "%";
    let t = 0;
    const flags = new Map();
    const once = (p, k, fn) => { const key = p.title + k; if (!flags.has(p) ) flags.set(p, new Set()); const s = flags.get(p); if (!s.has(k)) { s.add(k); fn(); } };

      if (pl.egressAt === 0) { P.bars.egress.className = "ok"; } else { P.bars.egress.className = "dimf"; }

    };
    setup(A, pa); setup(B, pb);

      if (!await r.sleep(60)) return;
      t += 0.5;

        if (P.done === r) continue;
        P.bars.egress.style.width = pct(pl.ok ? t : t);
        if (pl.ok) {
          P.bars.fetch.className = "ok"; P.bars.fetch.style.width = pct(Math.min(t, pl.fetchEnd));
          P.bars.probe.className = t >= pl.fetchEnd ? "ok" : "dimf"; P.bars.probe.style.width = pct(t);
          if (t >= pl.fetchEnd) once(P, "f", () => P.log.add(pl.fetchEnd, "Model download finished; `/readyz` starts passing".replace(/`/g, ""), "ok"));
          if (t >= pl.fetchEnd + 1) {
            once(P, "r", () => {
              P.log.add(pl.fetchEnd + 1, goldenPath ? "Probe passed; golden snapshot taken" : "Probe passed; ingress opens", "ok");
              P.bars.ingress.className = "ok"; P.bars.ingress.style.marginLeft = pct(pl.fetchEnd + 1); P.bars.ingress.style.width = "40%";
              setOut(P.out, badge(goldenPath ? "Golden built" : "RUNNING", "ok"), `Ready at ${pl.fetchEnd + 1}s, in a modeled 12s download.`);
            });

    check("Kernel supports core scheduling (prctl PR_SCHED_CORE)", st.kernel, v => { st.kernel = v; zero(); }), hint),
    h("div.panes", A.el, B.el), h("div.key", TEN.map(t => h("span", { style: `--k:var(${t[1]})` }, `sandbox ${t[0]}`))));
  function zero() { [A, B].forEach(p => { p.tot = { x: 0, i: 0, ran: 0, ready: 0, ticks: 0 }; }); hint.textContent = st.kernel ? "" : "The probe fails, so channel B runs without the flag. Same result as A."; }
  function paintCore(cell, tenant, forced) {
    cell.className = "thread" + (tenant == null ? (forced ? " forced" : " idle") : "");
    cell.style.background = tenant == null ? "" : `var(${TEN[tenant][1]})`;
    cell.textContent = tenant == null ? "" : TEN[tenant][0];

    const q = ready.slice().sort(() => Math.random() - .5); let ran = 0;

      core.c.className = "core";
      if (pick == null) { paintCore(core.t[0], null); paintCore(core.t[1], null); return; }
      const n = Math.min(2, counts[pick]); counts[pick] -= n; ran += n;

/* ---------- scene: streaming authz ---------- */
function sceneStream(root, ctx) {
  const CALLERS = [["none", "No credentials"], ["nogrant", "ServiceAccount, no grants"], ["viewer", "Viewer on the atespace"]];

    if (rpc === "reflect") return { code: "OK", k: "warn", at: 2, note: "Open to any authenticated caller, like Kubernetes discovery. It returns only the public schema." };
    return ver === "a" ? { code: "Handler runs", k: "bad", at: 2, note: "Streams passed after authentication alone. No authz interceptor ran." }
      : { code: "PermissionDenied", k: "ok", at: 1, note: "permission denied: no authorization rule for <method>" };
  };

    P.m.textContent = "";
    P.m.append(h("span.hd"), ...RPCS.map(r => h("span.hd", r[1])));

    p.inner.append(h("div.lane", h("span", "Worker pod"), h("div.bar", pod)), h("div.lane", h("span", "a1 stall, 2s"), h("div.bar", stall, stallMark)));
    const log = logBox(), out = h("div.outcome"), s1 = statBox("actors down", "0/4"), s2 = statBox("worker restarts", "0"), s3 = statBox("requests served by neighbors", "0");

  };
  const A = mk("a", "memory.max on the actor"), B = mk("b", "memory.high and a watcher");
  root.append(h("div.ctl",
    seg("Sandbox class", [["gvisor", "gVisor"], ["microvm", "Micro-VM"]], st.cls, v => { st.cls = v; reset(); }),
    slider("a1 leak rate", 40, 400, 20, st.rate, v => v + " MiB/s", v => { st.rate = v; }),
    h("div", { style: "display:grid;gap:5px" },
      check("Node kernel has PSI (memory.pressure)", st.psi, v => { st.psi = v; reset(); }),
      check("Node has runc ≥ 1.5.2 with systemd 253-258", st.affected, v => { st.affected = v; reset(); })),
    h("button.btn.go", { onclick: start }, "Start the leak"), h("button.btn", { onclick: reset }, "Reset")),
    h("div.panes", A.el, B.el),
    h("div.key", h("span", { style: "--k:var(--b)" }, "memory in use"), h("span", { style: "--k:var(--ink)" }, "the actor's booked limit"), h("span", { style: "--k:var(--warn)" }, "stall share; the mark is the 25% kill line")));
  function makeState() { return { t: 0, mem: BASE.slice(), status: NAMES.map(() => "RUNNING"), served: 0, samples: [], acc: 0, over: false, phase: "", throttle: false }; }
  let S = { A: makeState(), B: makeState() };
  function paintPane(P, s) {
    const max = st.cls === "microvm" ? 720 : 320;
    s.mem.forEach((m, i) => {
      const down = s.status[i] === "CRASHED";
      P.rows[i].fill.style.width = (down ? 0 : Math.min(100, m / max * 100)) + "%";
      P.rows[i].fill.style.background = s.status[i] === "THROTTLED" ? "var(--warn)" : "";
      P.rows[i].mark.style.left = booked() / max * 100 + "%";
      P.rows[i].s.className = "st " + s.status[i];
      P.rows[i].s.textContent = s.status[i];
    });
    const used = WORKER + s.mem.reduce((a, m, i) => a + (s.status[i] === "CRASHED" ? 0 : m), 0);
    P.pod.style.width = Math.min(100, used / POD * 100) + "%";
    P.pod.style.background = used > POD * .9 ? "var(--bad)" : "";
    P.stall.style.width = Math.min(100, (s.share || 0) * 100) + "%";
    P.s1.set(s.status.filter(x => x === "CRASHED").length + "/4");
    P.s2.set(s.workerDown ? "1" : "0");
    P.s3.set(Math.round(s.served));
  }
  function killAll(P, s, why) {
    s.status = s.status.map(() => "CRASHED"); s.workerDown = true; s.over = true;
    P.log.add(s.t, why, "bad");
    P.log.add(s.t, "Worker restarted. All 4 actors CRASHED, losing everything since their last snapshot.", "bad");
    setOut(P.out, badge("4 of 4 down", "bad"), "One leak took out every neighbor.");
  }
  function killOne(P, s, why) {
    s.status[0] = "CRASHED"; s.over = true;
    P.log.add(s.t, why, "ok");
    P.log.add(s.t, 'a1 CRASHED: "killed for exceeding its memory limit". Others keep running.', "ok");
    setOut(P.out, badge("1 of 4 down", "ok"), rich("span", `Contained in ${(s.t - s.hit).toFixed(1)}s from reaching the limit. Run \`kubectl ate revert actor a1\` to recover it.`));
  }
  function step(P, s, dt) {
    if (s.over) { s.served += s.status.filter((x, i) => i && x === "RUNNING").length * 12 * dt * (s.workerDown ? 0 : 1); return; }
    s.t += dt;
    s.served += 3 * 12 * dt;
    const th = booked();
    const used = WORKER + s.mem.reduce((a, b) => a + b, 0);
    const guarded = P.kind === "b" && st.psi;
    if (guarded) {
      let stalled = 0;

      else { if (s.hit == null) { s.hit = s.t; s.status[0] = "THROTTLED"; P.log.add(s.t, `a1 reached memory.high (${th} MiB). The kernel throttles it instead of killing.`, "warn"); } s.mem[0] += 6 * dt; stalled = .6; }

      if (s.share >= .25) killOne(P, s, `Stalled ${Math.round(s.share * 100)}% of the last 2s at its own limit. Worker runs cgroup.kill.`);

    } else {
      s.mem[0] += st.rate * dt;
      if (st.cls === "gvisor") {
        if (s.mem[0] >= th) {
          s.hit = s.t;
          if (st.affected) killAll(P, s, "Kernel OOM kill in a1's cgroup. The worker scope has OOMPolicy=kill, so systemd stops the whole worker.");
          else { s.status[0] = "CRASHED"; s.over = true; P.log.add(s.t, "Kernel OOM kill stays inside a1's cgroup on this node.", "warn"); setOut(P.out, badge("1 of 4 down", "warn"), "This runc and systemd combination doesn't escalate the kill."); }
        }

    if (!st.psi) B.log.add("boot", "Kernel has no cgroup memory pressure (PSI), so the worker sets no memory guard and warns at startup.", "warn");
    paintPane(A, S.A); paintPane(B, S.B);
  }
  function start() {
    reset();
    stops.push(ctx.loop(dt => {

/* ---------- scene: suspend ---------- */
function sceneSuspend(root, ctx) {
  const st = { pod: 1088, disk: 200 };
  const COPY = 400, USE = 225, BOOK = 256, WORKER = 32, RESERVED = 64;
  let stop = null;
  const mk = (kind, title) => {
    const p = pane(kind, title, kind === "a" ? A_TITLE : B_TITLE);
    const rows = ["a1", "a2", "a3", "a4"].map(n => { const fill = h("i"), s = h("span.st"); p.inner.append(h("div.actor", h("span.nm", n), h("div.bar", fill), s)); return { fill, s }; });
    const stack = h("div.stack"), s1 = statBox("wave time"), s2 = statBox("peak page cache"), s3 = statBox("actors lost"), out = h("div.outcome");
    p.inner.append(h("span.lab", "Worker pod memory"), stack, h("div.stats", s1, s2, s3), out);
    return { ...p, kind, rows, stack, s1, s2, s3, out };
  };
  const A = mk("a", "4 writes at once, uncapped cache"), B = mk("b", "2 write slots, capped cache");
  root.append(h("div.ctl",
    seg("Pod size", [[1088, "Tight: 1088 MiB"], [2048, "Roomy: 2048 MiB"]], st.pod, v => { st.pod = +v; reset(); }),
    slider("Disk write speed", 100, 800, 50, st.disk, v => v + " MiB/s", v => { st.disk = v; reset(); }),
    h("button.btn.go", { onclick: start }, "Suspend all four"), h("button.btn", { onclick: reset }, "Reset")),
    h("div.panes", A.el, B.el),
    h("div.key", h("span", { style: "--k:var(--a)" }, "worker process"), h("span", { style: "--k:var(--t1)" }, "actor memory"), h("span", { style: "--k:var(--t3)" }, "page cache from snapshot writes")));
  const fresh = () => ({ t: 0, prog: [0, 0, 0, 0], cache: 0, peak: 0, done: false, dead: false });
  let SA = fresh(), SB = fresh();
  function paint(P, s) {
    const pod = st.pod;
    s.prog.forEach((x, i) => {
      P.rows[i].fill.style.width = (s.dead ? 0 : x / USE * 100) + "%";
      const label = s.dead ? "CRASHED" : x >= USE ? "DONE" : x > 0 ? "WRITING" : s.t ? "waiting" : "RUNNING";
      P.rows[i].s.className = "st " + label; P.rows[i].s.textContent = label;
    });
    const held = s.dead ? 0 : s.prog.reduce((a, x) => a + (x >= USE ? 0 : USE), 0);
    P.stack.textContent = "";
    const pc = v => Math.min(100, v / pod * 100);
    P.stack.append(h("i", { style: `width:${pc(WORKER)}%;background:var(--a)` }), h("i", { style: `width:${pc(held)}%;background:var(--t1)` }), h("i", { style: `width:${pc(s.dead ? 0 : s.cache)}%;background:var(--t3)` }));
    P.s1.set(s.dead || !s.t ? "–" : (s.wrote || s.t).toFixed(1) + "s");
    P.s2.set(Math.round(s.peak) + " MiB"); P.s3.set(s.dead ? "4" : "0");
  }
  function step(P, s, dt) {
    if (s.done || s.dead) return;
    s.t += dt;
    const held = s.prog.reduce((a, x) => a + (x >= USE ? 0 : USE), 0);
    const slots = P.kind === "a" ? 4 : 2;
    const active = s.prog.map((x, i) => x < USE ? i : -1).filter(i => i >= 0).slice(0, slots);
    let room = Infinity;
    if (P.kind === "b") {
      // Same rule as checkpointCacheLimit in cmd/ateworker-gvisor/memory.go: a write the pod can lend all of
      // has no limit, otherwise max(16 MiB headroom, booked - used) plus whatever it could borrow.
      const lend = Math.max(0, st.pod - RESERVED - 4 * BOOK) / Math.max(1, active.length);
      if (lend < USE) room = active.length * (Math.max(16, BOOK - USE) + lend) - s.cache;
    }
    const budget = Math.min(COPY * dt, Math.max(0, room) + st.disk * dt);
    if (active.length) active.forEach(i => { s.prog[i] = Math.min(USE, s.prog[i] + budget / active.length); });
    s.cache += active.length ? budget : 0;
    s.cache = Math.max(0, s.cache - st.disk * dt);
    s.peak = Math.max(s.peak, s.cache);
    if (!active.length && !s.wrote) s.wrote = s.t;
    const usage = WORKER + held + s.cache;
    if (usage >= st.pod) {
      s.dead = true;
      setOut(P.out, badge("Worker OOM-killed", "bad"), `Page cache hit the pod limit at ${s.t.toFixed(1)}s. All four actors crash mid-suspend.`);
    } else if (!active.length && s.cache < 1) {
      s.done = true; s.cache = 0;
      const tight = st.pod < 2000;
      setOut(P.out, badge("All four suspended", "ok"), !tight ? "This pod had room to lend, so writes ran at full speed." : P.kind === "b" && st.disk < COPY ? "Slowed to disk speed instead of dying." : "The disk kept up at this speed. Slow it down to see the difference.");
    }
  }
  function reset() { if (stop) stop(); SA = fresh(); SB = fresh(); setOut(A.out); setOut(B.out); paint(A, SA); paint(B, SB); }
  function start() {
    reset();
    stop = ctx.loop(dt => { step(A, SA, dt); step(B, SB, dt); paint(A, SA); paint(B, SB); if ((SA.done || SA.dead) && (SB.done || SB.dead)) return false; });
  }
  reset();
}
