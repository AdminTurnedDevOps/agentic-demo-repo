apiVersion: v1
kind: ConfigMap
metadata:
  name: atenet-egress-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  atenet-egress-agentgateway.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "row",
          "title": "agentgateway on atenet-egress (Prometheus)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "type": "stat",
          "title": "Active connections",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(agentgateway_connections_active{namespace=\"ate-system\"}) or sum(agentgateway_connections_active)",
              "legendFormat": "active"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Request rate",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(agentgateway_requests_total{namespace=\"ate-system\"}[1m])) or sum(rate(agentgateway_requests_total[1m]))",
              "legendFormat": "req/s"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Connection rate",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(agentgateway_connections_total{namespace=\"ate-system\"}[1m])) or sum(rate(agentgateway_connections_total[1m]))",
              "legendFormat": "conn/s"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Request duration p95",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(agentgateway_request_duration_seconds_bucket{namespace=\"ate-system\"}[5m]))) or histogram_quantile(0.95, sum by (le) (rate(agentgateway_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Requests / s",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (status, method) (rate(agentgateway_requests_total[1m]))",
              "legendFormat": "{{method}} {{status}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Connections",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(agentgateway_connections_active)",
              "legendFormat": "active"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(agentgateway_connections_total[1m]))",
              "legendFormat": "opened/s"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Request duration p50 / p95 / p99",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(agentgateway_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(agentgateway_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(agentgateway_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "type": "row",
          "title": "Traces (Tempo)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 21 }
        },
        {
          "type": "text",
          "title": "Open Tempo Explore",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 22 },
          "options": {
            "mode": "markdown",
            "content": "Prometheus does not store traces. Use **Explore → Tempo**.\n\nSearch `service.name=\"atenet-egress\"` (set in the egress ConfigMap `resources.service.name`).\n\nTunnel-mode CONNECT spans can be thinner than HTTP route spans. If Explore is empty after several Claude ticks, access logs on `deploy/atenet-egress` still prove the hop."
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["agentgateway", "substrate", "egress"],
      "templating": { "list": [] },
      "time": { "from": "now-30m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "atenet-egress (agentgateway)",
      "uid": "atenet-egress-agw",
      "version": 1
    }
