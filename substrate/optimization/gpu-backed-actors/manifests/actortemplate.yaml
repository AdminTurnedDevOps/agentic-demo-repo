apiVersion: ate.dev/v1alpha1
kind: ActorTemplate
metadata:
  name: gpu-agent
  namespace: ate-demo-gpu
spec:
  sandboxClass: gvisor
  workerSelector:
    matchLabels:
      workload: gpu
  containers:
  - name: gpu-agent
    image: ${GPU_WORKLOAD_IMAGE}
    readyz:
      httpGet:
        path: /readyz
        port: 80
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
  snapshotsConfig:
    location: ${SNAPSHOT_LOCATION}
    onPause: Full
    onCommit: Full
