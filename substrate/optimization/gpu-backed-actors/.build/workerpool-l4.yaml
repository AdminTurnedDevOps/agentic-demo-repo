apiVersion: v1
kind: Namespace
metadata:
  name: ate-demo-gpu
  labels:
    gpu-backed-actors-demo: "true"
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: gpu-workers
  namespace: ate-demo-gpu
  labels:
    workload: gpu
spec:
  replicas: 1
  sandboxClass: gvisor
  workerImage: gcr.io/example/ateom-gvisor-glibc@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  template:
    nodeSelector:      cloud.google.com/gke-accelerator: nvidia-l4    tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "2"
        memory: 4Gi
        nvidia.com/gpu: "1"
