# Self-hosted Prometheus for the burst lab.
#
# Why not Google Managed Prometheus (GMP)? The HPA needs the series on the
# Kubernetes External Metrics API. With GMP that means the
# custom-metrics-stackdriver-adapter plus Workload Identity IAM. A small
# in-cluster Prometheus plus prometheus-adapter (prometheus-adapter.yaml) keeps
# the lab self-contained and matches the upstream kind demo
# (demos/autoscaled-workerpool).
#
# It scrapes only ate-system pods annotated prometheus.io/scrape=true, on the
# port each pod's prometheus.io/port annotation names. With the agentgateway
# dataplane those are:
#   ate-api-server :9090   ate_workerpool_workers (the HPA's input)
#   atenet-router  :15020  agentgateway stats: agentgateway_substrate_request_parking_active,
#                          agentgateway_atenet_router_route_duration_seconds_*
# (the agentgateway overlay rewrites the router pod's annotation to 15020).

apiVersion: v1
kind: Namespace
metadata:
  name: ate-lab-burst-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: ate-lab-burst-monitoring
---
# Pod discovery is limited to ate-system: a Role there, not a ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ate-lab-burst-prometheus
  namespace: ate-system
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ate-lab-burst-prometheus
  namespace: ate-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ate-lab-burst-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: ate-lab-burst-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ate-lab-burst-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      # Annotation-driven pod scrape, adapted from the upstream kind install
      # (manifests/ate-install/kind/prometheus.yaml), scoped to ate-system.
      - job_name: ate-system-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - ate-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
            action: replace
            regex: (\d+);((([0-9]+?)(\.|$)){4})
            replacement: $2:$1
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_phase]
            action: drop
            regex: Pending|Succeeded|Failed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ate-lab-burst-monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=6h
        ports:
        - name: http
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: data
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ate-lab-burst-monitoring
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
---
# Only prometheus-adapter may reach Prometheus over the pod network.
# kubectl port-forward connects inside the pod's network namespace, so the
# lab's port-forward to the Prometheus UI is not affected by this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress
  namespace: ate-lab-burst-monitoring
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: prometheus-adapter
    ports:
    - protocol: TCP
      port: 9090
